<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">GlassFit material mapping with persistent 3D preview</title>
  <desc id="desc">The existing Components layout keeps its upload area, mapping summary, 3D preview, right inspector panel, and component table. The right panel is in Map Materials mode with group selection, catalog search, and one action to link three highlighted parts.</desc>
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f1422"/><stop offset="1" stop-color="#203c49"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4f7"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
    <filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#0f1422" flood-opacity=".08"/></filter>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#0f1422}.white{fill:#fff}.muted{fill:#667085}.cyan{fill:#078fa9}.amber{fill:#aa5a0b}.small{font-size:13px}.tiny{font-size:11px}.label{font-size:14px;font-weight:650}.heading{font-size:24px;font-weight:750}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1600" height="1260" fill="#f8fafb"/>
  <rect width="1600" height="64" fill="#0f1422"/>
  <text x="40" y="41" class="white" font-size="23" font-weight="800">GlassFit</text><text x="1300" y="39" class="white small">Admin workspace</text>
  <circle cx="1550" cy="32" r="18" fill="#07b6d3"/><text x="1542" y="37" class="white tiny" font-weight="700">GR</text>
  <text x="42" y="101" class="muted small">Products  /  Series 798 Sliding Window  /  Setup</text>
  <text x="42" y="140" class="heading">Structural components</text>
  <text x="42" y="164" class="muted small">Upload, preview, and map materials without leaving this Components step.</text>

  <rect x="42" y="184" width="1516" height="46" rx="12" fill="#fff" stroke="#e4e7ec"/>
  <text x="67" y="213" class="muted small">1  Basic Info</text><text x="235" y="213" class="muted small">2  Assets</text><text x="371" y="213" class="muted small">3  Strategy</text>
  <rect x="489" y="190" width="167" height="34" rx="8" fill="#e9f9fb"/><text x="506" y="212" class="cyan small" font-weight="700">4  Components</text>
  <text x="690" y="213" class="muted small">5  Parameters &amp; Rules</text><text x="915" y="213" class="muted small">6  Validation</text><text x="1067" y="213" class="muted small">7  Review</text>

  <rect x="42" y="249" width="1516" height="48" rx="11" fill="#f2f4f7"/>
  <rect x="52" y="256" width="193" height="34" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="70" y="278" class="small" font-weight="700">Upload Individual Parts</text>
  <text x="267" y="278" class="muted small">Decompose Whole Model</text>
  <text x="1088" y="278" class="muted small">Upload standalone profile and glass .glb files</text>
  <rect x="42" y="312" width="1516" height="98" rx="16" fill="#f7f8fa" stroke="#cfd6dd" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="748" y="344" class="muted" font-size="22">↥</text>
  <text x="628" y="370" class="label">Drag &amp; drop multiple .glb parts here</text>
  <text x="605" y="391" class="muted tiny">Auto-detects heads, sills, jambs, rails, glass, and rollers</text>

  <rect x="42" y="428" width="1516" height="82" rx="16" fill="url(#banner)"/>
  <text x="66" y="453" class="white tiny" opacity=".68">TOTAL PARTS</text><text x="66" y="485" class="white" font-size="20" font-weight="700">8 components</text>
  <line x1="345" y1="447" x2="345" y2="492" stroke="#52606d"/>
  <text x="369" y="453" class="white tiny" opacity=".68">CATALOG LINKED</text><text x="369" y="485" class="white" font-size="20" font-weight="700">5 of 8 linked</text>
  <line x1="684" y1="447" x2="684" y2="492" stroke="#52606d"/>
  <text x="710" y="453" class="white tiny" opacity=".68">NEEDS REVIEW</text><text x="710" y="485" class="white" font-size="20" font-weight="700">3 parts</text>
  <text x="1290" y="454" class="white tiny" opacity=".68">BOM ESTIMATION STATUS</text><text x="1290" y="483" class="white small">Ready for simulator</text>

  <rect x="42" y="528" width="1516" height="506" rx="16" fill="#fff" stroke="#e4e7ec" filter="url(#soft)"/>
  <path d="M58 528h854v506H58a16 16 0 0 1-16-16V544a16 16 0 0 1 16-16Z" fill="url(#stage)"/>
  <line x1="912" y1="528" x2="912" y2="1034" stroke="#e4e7ec"/>
  <rect x="62" y="545" width="284" height="31" rx="15" fill="#fff" stroke="#e4e7ec"/>
  <text x="77" y="566" class="muted tiny">Click a part or Shift+Click to select several</text>
  <rect x="693" y="545" width="202" height="31" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <rect x="699" y="550" width="91" height="21" rx="6" fill="#0f1422"/>
  <text x="711" y="565" class="white tiny">Assembled</text><text x="805" y="565" class="muted tiny">Exploded</text>

  <g transform="translate(205 604)">
    <path d="M120 0h290l48 40v288l-44 39H116l-42-39V40Z" fill="#b8c2c8" stroke="#718692" stroke-width="5"/>
    <path d="M148 37h233l40 30v237l-37 30H146l-38-30V67Z" fill="#d8edf2" stroke="#829aa5" stroke-width="5"/>
    <path d="M263 39v293M110 185h312" stroke="#8ca1ab" stroke-width="17"/>
    <path d="M119 0h292l48 40v14H72V40Z" fill="#07b6d3" opacity=".85" stroke="#0786a1" stroke-width="3"/>
    <path d="M74 42h31v286l42 39h-31l-42-39Z" fill="#07b6d3" opacity=".8" stroke="#0786a1" stroke-width="3"/>
    <path d="M412 0l47 40v288l-43 39h-30l40-39V41l-44-41Z" fill="#07b6d3" opacity=".8" stroke="#0786a1" stroke-width="3"/>
    <circle cx="270" cy="28" r="10" fill="#fff" stroke="#07b6d3" stroke-width="4"/>
    <circle cx="90" cy="183" r="10" fill="#fff" stroke="#07b6d3" stroke-width="4"/>
    <circle cx="440" cy="183" r="10" fill="#fff" stroke="#07b6d3" stroke-width="4"/>
  </g>
  <rect x="42" y="990" width="870" height="44" fill="#fff"/>
  <text x="65" y="1018" class="muted small">8 parts mapped  ·  <tspan font-weight="700" fill="#078fa9">3 selected in preview</tspan></text>
  <text x="732" y="1018" class="cyan small">Select All</text><text x="815" y="1018" class="muted small">Clear</text>

  <rect x="913" y="529" width="644" height="58" fill="#fcfcfc"/>
  <text x="938" y="566" class="cyan label">Map Materials</text><line x1="936" y1="585" x2="1058" y2="585" stroke="#07b6d3" stroke-width="3"/>
  <text x="1095" y="566" class="muted label">Part Settings</text>
  <text x="1496" y="566" class="muted small">×</text>
  <text x="938" y="614" class="label">Link several parts at once</text>
  <text x="938" y="634" class="muted tiny">The highlighted 3D parts and checked rows share this selection.</text>

  <rect x="938" y="650" width="593" height="38" rx="9" fill="#f7f9fb" stroke="#e4e7ec"/>
  <text x="952" y="674" class="small">Framing</text><text x="1094" y="674" class="muted small">Glazing</text><text x="1203" y="674" class="muted small">Hardware</text>
  <rect x="1335" y="655" width="185" height="28" rx="7" fill="#e9f9fb"/>
  <text x="1350" y="674" class="cyan tiny" font-weight="700">Select 3 unlinked</text>
  <text x="938" y="713" class="label">3 selected parts</text><text x="1450" y="713" class="cyan tiny">Clear selection</text>
  <rect x="938" y="726" width="593" height="71" rx="10" fill="#f1fbfd" stroke="#b7e9f1"/>
  <rect x="952" y="742" width="18" height="18" rx="4" fill="#07b6d3"/><text x="956" y="756" class="white tiny">✓</text><text x="979" y="756" class="small">Frame Top</text>
  <rect x="1149" y="742" width="18" height="18" rx="4" fill="#07b6d3"/><text x="1153" y="756" class="white tiny">✓</text><text x="1176" y="756" class="small">Frame Left</text>
  <rect x="1342" y="742" width="18" height="18" rx="4" fill="#07b6d3"/><text x="1346" y="756" class="white tiny">✓</text><text x="1369" y="756" class="small">Frame Right</text>
  <text x="952" y="782" class="muted tiny">All 3 are unlinked. Existing material links remain untouched.</text>

  <text x="938" y="825" class="label">Choose a catalog material</text>
  <rect x="938" y="838" width="593" height="37" rx="8" fill="#fff" stroke="#cfd6dd"/>
  <text x="951" y="861" class="muted small">⌕  Search material code, finish, or description</text>
  <rect x="938" y="888" width="593" height="62" rx="10" fill="#e9f9fb" stroke="#07b6d3" stroke-width="2"/>
  <circle cx="957" cy="910" r="8" fill="#07b6d3"/><circle cx="957" cy="910" r="3.5" fill="#fff"/>
  <text x="974" y="913" class="code small" font-weight="700">AL-798-MILL</text>
  <text x="974" y="935" class="muted tiny">Aluminum · Mill · PHP 215.00/m</text>
  <text x="1385" y="923" class="cyan tiny" font-weight="700">Selected</text>
  <rect x="938" y="960" width="593" height="59" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="952" y="981" class="small" font-weight="700">Ready to link 3 parts</text>
  <text x="952" y="1001" class="muted tiny">This will mark them Unsaved until component changes are saved.</text>
  <rect x="1327" y="968" width="190" height="40" rx="8" fill="#07b6d3"/>
  <text x="1343" y="994" class="white small" font-weight="700">Link to 3 parts  →</text>

  <rect x="42" y="1052" width="1516" height="148" rx="12" fill="#fff" stroke="#e4e7ec"/>
  <text x="62" y="1080" class="label">Uploaded Components (8)</text>
  <text x="1110" y="1080" class="muted small">3 parts selected above and in the 3D preview</text>
  <rect x="42" y="1092" width="1516" height="31" fill="#f9fafb"/>
  <text x="62" y="1112" class="muted tiny">SELECT</text><text x="145" y="1112" class="muted tiny">COMPONENT NAME</text><text x="671" y="1112" class="muted tiny">DRIVER</text><text x="839" y="1112" class="muted tiny">SPAN RATIO</text><text x="1018" y="1112" class="muted tiny">MATERIAL LINK</text><text x="1384" y="1112" class="muted tiny">STATUS</text>
  <rect x="43" y="1124" width="1514" height="37" fill="#f1fbfd"/>
  <rect x="62" y="1135" width="16" height="16" rx="3" fill="#07b6d3"/><text x="65" y="1148" class="white tiny">✓</text>
  <text x="145" y="1149" class="small" font-weight="700">Frame Top</text><text x="671" y="1149" class="small">WIDTH</text><text x="839" y="1149" class="small">1.00x</text><text x="1018" y="1149" class="amber small">Unassigned</text><text x="1384" y="1149" class="muted small">Ready</text>
  <text x="145" y="1185" class="small">Frame Bottom</text><text x="671" y="1185" class="small">WIDTH</text><text x="839" y="1185" class="small">1.00x</text><text x="1018" y="1185" class="cyan small">AL-798-ANOD</text><text x="1384" y="1185" class="muted small">Ready</text>
  <rect x="1325" y="1214" width="233" height="34" rx="9" fill="#0f1422"/>
  <text x="1342" y="1236" class="white small" font-weight="700">Continue to Parameters &amp; Rules</text>
</svg>
