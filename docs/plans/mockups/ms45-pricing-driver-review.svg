<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
  <title id="title">GlassFit pricing driver review with persistent 3D preview</title>
  <desc id="desc">The 3D preview remains visible. The right panel reviews Width, Height, Area, and Fixed pricing drivers for selected parts. The table below shows each part's material and driver.</desc>
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f1422"/><stop offset="1" stop-color="#203c49"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4f7"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
    <filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#0f1422" flood-opacity=".08"/></filter>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#0f1422}.white{fill:#fff}.muted{fill:#667085}.cyan{fill:#078fa9}.amber{fill:#aa5a0b}.small{font-size:13px}.tiny{font-size:11px}.label{font-size:14px;font-weight:650}.heading{font-size:24px;font-weight:750}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1600" height="1010" fill="#f8fafb"/>
  <rect width="1600" height="64" fill="#0f1422"/><text x="40" y="41" class="white" font-size="23" font-weight="800">GlassFit</text><text x="1300" y="39" class="white small">Admin workspace</text>
  <circle cx="1550" cy="32" r="18" fill="#07b6d3"/><text x="1542" y="37" class="white tiny" font-weight="700">GR</text>
  <text x="42" y="102" class="muted small">Products  /  Series 798 Sliding Window  /  Setup</text>
  <text x="42" y="143" class="heading">Structural components</text>
  <text x="42" y="168" class="muted small">Keep the model in view while confirming how each part is measured for pricing.</text>
  <rect x="42" y="189" width="1516" height="48" rx="12" fill="#fff" stroke="#e4e7ec"/>
  <text x="67" y="219" class="muted small">1  Basic Info</text><text x="235" y="219" class="muted small">2  Assets</text><text x="371" y="219" class="muted small">3  Strategy</text>
  <rect x="489" y="196" width="167" height="34" rx="8" fill="#e9f9fb"/><text x="506" y="218" class="cyan small" font-weight="700">4  Components</text>
  <text x="690" y="219" class="muted small">5  Parameters &amp; Rules</text><text x="915" y="219" class="muted small">6  Validation</text><text x="1067" y="219" class="muted small">7  Review</text>
  <rect x="42" y="257" width="1516" height="77" rx="16" fill="url(#banner)"/>
  <text x="66" y="282" class="white tiny" opacity=".68">TOTAL PARTS</text><text x="66" y="311" class="white" font-size="20" font-weight="700">8 components</text>
  <line x1="352" y1="275" x2="352" y2="317" stroke="#52606d"/>
  <text x="378" y="282" class="white tiny" opacity=".68">MATERIAL LINKS</text><text x="378" y="311" class="white" font-size="20" font-weight="700">8 of 8 linked</text>
  <line x1="697" y1="275" x2="697" y2="317" stroke="#52606d"/>
  <text x="723" y="282" class="white tiny" opacity=".68">PRICING DRIVERS</text><text x="723" y="311" class="white" font-size="20" font-weight="700">Width · Height · Area · Fixed</text>
  <text x="1260" y="299" class="white small">2 parts selected for review</text>

  <rect x="42" y="353" width="1516" height="501" rx="16" fill="#fff" stroke="#e4e7ec" filter="url(#soft)"/>
  <path d="M58 353h854v501H58a16 16 0 0 1-16-16V369a16 16 0 0 1 16-16Z" fill="url(#stage)"/>
  <line x1="912" y1="353" x2="912" y2="854" stroke="#e4e7ec"/>
  <rect x="62" y="371" width="284" height="31" rx="15" fill="#fff" stroke="#e4e7ec"/><text x="77" y="392" class="muted tiny">Click a part or Shift+Click to select several</text>
  <rect x="692" y="371" width="202" height="31" rx="9" fill="#fff" stroke="#e4e7ec"/><rect x="699" y="376" width="91" height="21" rx="6" fill="#0f1422"/><text x="711" y="391" class="white tiny">Assembled</text><text x="805" y="391" class="muted tiny">Exploded</text>

  <g transform="translate(205 423)">
    <path d="M120 0h290l48 40v285l-44 38H116l-42-38V40Z" fill="#b8c2c8" stroke="#718692" stroke-width="5"/>
    <path d="M148 37h233l40 30v234l-37 29H146l-38-29V67Z" fill="#d8edf2" stroke="#829aa5" stroke-width="5"/>
    <path d="M263 39v290M110 183h312" stroke="#8ca1ab" stroke-width="17"/>
    <path d="M74 42h31v283l42 38h-31l-42-38Z" fill="#07b6d3" opacity=".83" stroke="#0786a1" stroke-width="3"/>
    <path d="M412 0l47 40v285l-43 38h-30l40-38V41l-44-41Z" fill="#07b6d3" opacity=".83" stroke="#0786a1" stroke-width="3"/>
    <circle cx="90" cy="183" r="10" fill="#fff" stroke="#07b6d3" stroke-width="4"/><circle cx="440" cy="183" r="10" fill="#fff" stroke="#07b6d3" stroke-width="4"/>
  </g>
  <rect x="42" y="812" width="870" height="42" fill="#fff"/>
  <text x="65" y="838" class="muted small">8 parts mapped  ·  <tspan font-weight="700" fill="#078fa9">2 selected in preview</tspan></text>
  <text x="730" y="838" class="cyan small">Select All</text><text x="815" y="838" class="muted small">Clear</text>

  <rect x="913" y="354" width="644" height="58" fill="#fcfcfc"/>
  <text x="937" y="391" class="muted label">Map Materials</text><text x="1092" y="391" class="cyan label">Pricing Drivers</text><text x="1290" y="391" class="muted label">Part Settings</text>
  <line x1="1090" y1="410" x2="1227" y2="410" stroke="#07b6d3" stroke-width="3"/>
  <text x="938" y="441" class="label">Review how selected parts are priced</text>
  <text x="938" y="462" class="muted tiny">Auto-detected values stay unless you explicitly change them.</text>

  <rect x="938" y="481" width="593" height="57" rx="10" fill="#e9f9fb" stroke="#b7e9f1"/>
  <text x="953" y="503" class="label">2 side frames selected</text><text x="953" y="524" class="muted tiny">Frame Left and Frame Right currently use Height × 1.00.</text>
  <text x="1410" y="513" class="cyan tiny">Change selection</text>

  <text x="938" y="567" class="label">Dimension driver</text>
  <text x="938" y="586" class="muted tiny">Choose the product dimension that determines billable quantity.</text>
  <rect x="938" y="602" width="285" height="58" rx="9" fill="#fff" stroke="#d0d5dd"/>
  <text x="954" y="626" class="label">Width (1D)</text><text x="954" y="646" class="muted tiny">Horizontal rails and sills</text>
  <rect x="1233" y="602" width="298" height="58" rx="9" fill="#e9f9fb" stroke="#07b6d3" stroke-width="2"/>
  <text x="1249" y="626" class="cyan label">✓  Height (1D)</text><text x="1249" y="646" class="muted tiny">Vertical jambs and stiles</text>
  <rect x="938" y="670" width="285" height="58" rx="9" fill="#fff" stroke="#d0d5dd"/>
  <text x="954" y="694" class="label">Area (2D)</text><text x="954" y="714" class="muted tiny">Glass and flat panels</text>
  <rect x="1233" y="670" width="298" height="58" rx="9" fill="#fff" stroke="#d0d5dd"/>
  <text x="1249" y="694" class="label">Fixed</text><text x="1249" y="714" class="muted tiny">Pieces, sets, and hardware</text>

  <text x="938" y="759" class="label">Span ratio / multiplier</text>
  <rect x="938" y="772" width="155" height="35" rx="8" fill="#e9f9fb" stroke="#07b6d3"/><text x="959" y="795" class="cyan small" font-weight="700">1.0x  Full span</text>
  <rect x="1102" y="772" width="145" height="35" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="1124" y="795" class="small">0.5x  Half</text>
  <rect x="1256" y="772" width="151" height="35" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="1277" y="795" class="small">0.33x  Third</text>
  <rect x="1416" y="772" width="115" height="35" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="1430" y="795" class="small">Custom  ⌄</text>
  <text x="938" y="833" class="muted tiny">These two parts are already correct. No action is needed.</text>
  <rect x="1356" y="816" width="174" height="29" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="1372" y="835" class="muted tiny" font-weight="700">Apply only if changed</text>

  <rect x="42" y="873" width="1516" height="115" rx="12" fill="#fff" stroke="#e4e7ec"/>
  <text x="62" y="901" class="label">Uploaded Components (8)</text><text x="1034" y="901" class="muted small">Driver and material are visible for every part</text>
  <rect x="43" y="913" width="1514" height="28" fill="#f9fafb"/>
  <text x="62" y="932" class="muted tiny">SELECT</text><text x="145" y="932" class="muted tiny">COMPONENT</text><text x="650" y="932" class="muted tiny">PRICING DRIVER</text><text x="884" y="932" class="muted tiny">SPAN</text><text x="1020" y="932" class="muted tiny">MATERIAL LINK</text><text x="1382" y="932" class="muted tiny">STATUS</text>
  <rect x="43" y="942" width="1514" height="42" fill="#f1fbfd"/>
  <rect x="62" y="955" width="16" height="16" rx="3" fill="#07b6d3"/><text x="65" y="968" class="white tiny">✓</text>
  <text x="145" y="970" class="small" font-weight="700">Frame Left</text><text x="650" y="970" class="cyan small">HEIGHT  ⌄</text><text x="884" y="970" class="small">1.00x</text><text x="1020" y="970" class="cyan small">AL-798-MILL</text><text x="1382" y="970" class="muted small">Ready</text>
</svg>
