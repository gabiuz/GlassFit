  <rect x="1080" y="698" width="119" height="35" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="1106" y="720" class="muted small">Area (2D)</text>
  <rect x="1207" y="698" width="162" height="35" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="1234" y="720" class="muted small">Static / Fixed</text>

