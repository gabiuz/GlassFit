<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">MS-45 material assignment workspace mockup</title>
  <desc id="desc">GlassFit Components step with a searchable material picker, selection action bar, and visible material link status.</desc>
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f1422"/><stop offset="1" stop-color="#1b3441"/></linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4f7"/><stop offset="1" stop-color="#e6edf1"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f1422" flood-opacity=".16"/></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#0f1422} .muted{fill:#6b7280} .small{font-size:12px} .tiny{font-size:10px} .label{font-size:13px;font-weight:600} .heading{font-size:22px;font-weight:700} .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace} .white{fill:#fff} .cyan{fill:#079fba} .amber{fill:#b45309}
    </style>
  </defs>
  <rect width="1440" height="1020" fill="#f8fafb"/>
  <rect width="1440" height="64" fill="#0f1422"/>
  <text x="36" y="40" class="white" font-size="23" font-weight="800">GlassFit</text>
  <text x="1150" y="38" class="white small">Admin workspace</text>
  <circle cx="1385" cy="32" r="18" fill="#07b6d3"/><text x="1378" y="38" class="white small" font-weight="700">GR</text>

  <text x="42" y="105" class="muted small">Products  /  Series 798 Sliding Window  /  Setup</text>
  <text x="42" y="140" class="heading">Structural components</text>
  <text x="42" y="162" class="muted small">Upload parts, inspect their geometry, and link catalog materials.</text>
  <rect x="42" y="188" width="1356" height="48" rx="12" fill="#fff" stroke="#e5e7eb"/>
  <text x="67" y="218" class="muted small">1  Basic Info</text><text x="220" y="218" class="muted small">2  Assets</text><text x="345" y="218" class="muted small">3  Strategy</text>
  <rect x="462" y="195" width="167" height="34" rx="8" fill="#e9f9fb"/><text x="478" y="217" class="cyan small" font-weight="700">4  Components</text>
  <text x="661" y="218" class="muted small">5  Parameters &amp; Rules</text><text x="861" y="218" class="muted small">6  Validation</text><text x="1001" y="218" class="muted small">7  Review</text>

  <rect x="42" y="260" width="1356" height="92" rx="16" fill="url(#banner)"/>
