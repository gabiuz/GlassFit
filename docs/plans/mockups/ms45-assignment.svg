  <rect x="817" y="941" width="309" height="34" fill="#fffbeb"/>
  <text x="124" y="963" class="small">Frame Bottom</text><text x="534" y="963" class="small">WIDTH</text><text x="685" y="963" class="small">1.00x</text><text x="829" y="963" class="amber small">⚠ Unassigned  ⌄</text><text x="1162" y="963" class="small muted">Ready</text>
