<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MS-45 bulk material review mockup</title>
  <desc id="desc">A review dialog lists selected parts, checks unassigned targets, and leaves existing material links unchecked before a batch assignment.</desc>
  <defs>
    <filter id="dialogShadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f1422" flood-opacity=".26"/></filter>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#0f1422}.white{fill:#fff}.muted{fill:#6b7280}.small{font-size:13px}.tiny{font-size:11px}.heading{font-size:22px;font-weight:700}.label{font-size:14px;font-weight:600}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.cyan{fill:#079fba}.amber{fill:#b45309}</style>
  </defs>
  <rect width="1440" height="900" fill="#f8fafb"/>
  <rect width="1440" height="64" fill="#0f1422"/><text x="37" y="40" class="white" font-size="23" font-weight="800">GlassFit</text><text x="1165" y="38" class="white small">Admin workspace</text>
  <text x="43" y="112" class="muted small">Products  /  Series 798 Sliding Window  /  Setup</text><text x="43" y="153" class="heading">Structural components</text>
  <rect x="43" y="180" width="1354" height="82" rx="16" fill="#0f1422"/><text x="68" y="211" class="white tiny">CATALOG LINKED</text><text x="68" y="241" class="white" font-size="20" font-weight="700">5 of 8 linked</text>
  <rect x="43" y="286" width="1354" height="470" rx="14" fill="#fff" stroke="#e5e7eb"/>
  <text x="64" y="322" class="label">Uploaded Components (8)</text><text x="1030" y="322" class="muted small">4 parts selected</text><rect x="1235" y="297" width="143" height="34" rx="8" fill="#07b6d3"/><text x="1253" y="319" class="white small" font-weight="700">Assign material</text>
  <line x1="44" y1="342" x2="1396" y2="342" stroke="#e5e7eb"/>
  <text x="65" y="375" class="muted small">✓</text><text x="134" y="375" class="muted small">Component name</text><text x="767" y="375" class="muted small">Material link</text><text x="1187" y="375" class="muted small">Status</text>
  <line x1="44" y1="390" x2="1396" y2="390" stroke="#e5e7eb"/>
  <text x="65" y="420" class="cyan small">☑</text><text x="134" y="420" class="small">Frame Top</text><text x="767" y="420" class="amber small">Unassigned</text><text x="1187" y="420" class="muted small">Ready</text>
  <line x1="44" y1="439" x2="1396" y2="439" stroke="#e5e7eb"/>
  <text x="65" y="469" class="cyan small">☑</text><text x="134" y="469" class="small">Frame Bottom</text><text x="767" y="469" class="amber small">Unassigned</text><text x="1187" y="469" class="muted small">Ready</text>
  <line x1="44" y1="488" x2="1396" y2="488" stroke="#e5e7eb"/>
  <text x="65" y="518" class="cyan small">☑</text><text x="134" y="518" class="small">Frame Left</text><text x="767" y="518" class="amber small">Unassigned</text><text x="1187" y="518" class="muted small">Ready</text>
  <line x1="44" y1="537" x2="1396" y2="537" stroke="#e5e7eb"/>
  <text x="65" y="567" class="cyan small">☑</text><text x="134" y="567" class="small">Frame Right</text><text x="767" y="567" class="cyan small">AL-798-ANOD</text><text x="1187" y="567" class="muted small">Ready</text>
  <rect width="1440" height="900" fill="#0f1422" opacity=".51"/>

  <rect x="339" y="130" width="762" height="638" rx="20" fill="#fff" filter="url(#dialogShadow)"/>
  <rect x="339" y="130" width="762" height="112" rx="20" fill="#fff"/>
  <rect x="366" y="157" width="48" height="48" rx="12" fill="#e9f9fb"/><text x="381" y="190" class="cyan" font-size="24">▦</text>
  <text x="431" y="170" class="heading">Review material assignment</text>
  <text x="431" y="195" class="muted small">Choose exactly which selected parts will receive this material.</text>
  <text x="1071" y="169" class="muted" font-size="21">×</text>
  <line x1="340" y1="229" x2="1100" y2="229" stroke="#e5e7eb"/>

  <rect x="366" y="254" width="708" height="78" rx="12" fill="#f8fafb" stroke="#e5e7eb"/>
  <text x="384" y="278" class="muted tiny">MATERIAL TO APPLY</text>
  <text x="384" y="304" class="code label">AL-798-MILL</text>
  <text x="563" y="304" class="small muted">Aluminum framing profile · Mill · PHP 215/m</text>
  <rect x="366" y="350" width="708" height="44" rx="9" fill="#e9f9fb"/>
  <text x="382" y="378" class="cyan small" font-weight="700">3 of 4 selected parts will be updated</text>
  <text x="366" y="426" class="muted small">Unassigned parts are checked. Linked parts stay unchanged unless you check them.</text>

  <rect x="366" y="446" width="708" height="54" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="385" y="463" width="18" height="18" rx="4" fill="#07b6d3"/><text x="389" y="477" class="white small">✓</text>
  <text x="420" y="470" class="label">Frame Top</text><text x="420" y="488" class="muted tiny code">frame_top</text>
  <rect x="936" y="461" width="119" height="25" rx="12" fill="#fffbeb"/><text x="953" y="478" class="amber tiny">Unassigned</text>

  <rect x="366" y="506" width="708" height="54" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="385" y="523" width="18" height="18" rx="4" fill="#07b6d3"/><text x="389" y="537" class="white small">✓</text>
  <text x="420" y="530" class="label">Frame Bottom</text><text x="420" y="548" class="muted tiny code">frame_bottom</text>
  <rect x="936" y="521" width="119" height="25" rx="12" fill="#fffbeb"/><text x="953" y="538" class="amber tiny">Unassigned</text>

  <rect x="366" y="566" width="708" height="54" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="385" y="583" width="18" height="18" rx="4" fill="#07b6d3"/><text x="389" y="597" class="white small">✓</text>
  <text x="420" y="590" class="label">Frame Left</text><text x="420" y="608" class="muted tiny code">frame_left</text>
  <rect x="936" y="581" width="119" height="25" rx="12" fill="#fffbeb"/><text x="953" y="598" class="amber tiny">Unassigned</text>

  <rect x="366" y="626" width="708" height="54" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="385" y="643" width="18" height="18" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
  <text x="420" y="650" class="label">Frame Right</text><text x="420" y="668" class="muted tiny code">frame_right</text>
  <rect x="909" y="641" width="146" height="25" rx="12" fill="#f3f4f6"/><text x="921" y="658" class="muted tiny">Linked: AL-798-ANOD</text>

  <line x1="340" y1="698" x2="1100" y2="698" stroke="#e5e7eb"/>
  <text x="366" y="731" class="muted tiny">Changes are unsaved until you save component changes.</text>
  <rect x="820" y="712" width="94" height="37" rx="9" fill="#fff" stroke="#d1d5db"/><text x="841" y="736" class="small">Cancel</text>
  <rect x="924" y="712" width="150" height="37" rx="9" fill="#07b6d3"/><text x="942" y="736" class="white small" font-weight="700">Apply to 3 parts</text>
</svg>
